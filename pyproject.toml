[build-system]
requires = ["setuptools>=68.1.2"]
build-backend = "setuptools.build_meta"

[project]
name = "yusina"
version = "0.1.0-alpha"
description = "a package for pretty figures"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["science", "informatics", "bioinformatics", "cheminformatics", "scientific-figures", "data-visualisation", "data-analysis"]
authors = [{name = "Lucina-May Nollen"}]
maintainers =[{name = "Lucina-May Nollen"}]

classifiers = [
    "Development Status :: 3 - Alpha",
    "License ::  MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]


dependencies = [
    "matplotlib>=3.10",
    "numpy>=1.24",
    "plotly>=7.0.0",
    "polars>=1.0",
]

[project.urls]
"homepage" = "https://github.com/lucinamay/yusina"

[dependency-groups]
dev = [
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "polars>=1.36.1",
]

[tool.setuptools.package-data]
yusina = ["*.mplstyle", "*.csv"]
